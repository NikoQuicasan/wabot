version: '3'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: plataforma_postgres_local
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plataforma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword123}
      POSTGRES_DB: ${POSTGRES_DB:-chatwoot_db}
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    command: >
      sh -c "docker-entrypoint.sh postgres &
             until pg_isready -U $${POSTGRES_USER:-plataforma} -d $${POSTGRES_DB:-chatwoot_db}; do sleep 1; done;
             psql -U $${POSTGRES_USER:-plataforma} -d $${POSTGRES_DB:-chatwoot_db} -c 'CREATE DATABASE evolution_db;' || true;
             wait"
    networks:
      - plataforma_net_local

  redis:
    image: redis:7-alpine
    container_name: plataforma_redis_local
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redissecure123} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_local:/data
    networks:
      - plataforma_net_local

  chatwoot_rails:
    image: chatwoot/chatwoot:v4.15.1
    container_name: chatwoot_rails_local
    restart: always
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plataforma}:${POSTGRES_PASSWORD:-securepassword123}@postgres:5432/${POSTGRES_DB:-chatwoot_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redissecure123}@redis:6379
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY:-local_secret_key_base_123}
      FRONTEND_URL: http://localhost:3000
      DEFAULT_LOCALE: es
      NODE_ENV: development
      RAILS_ENV: development
    volumes:
      - .:/app # 👈 Vincula tus logos y estilos de tu Mac en vivo
    ports:
      - "3000:3000"
    command: sh -c "bundle exec rails db:prepare && bundle exec rails s -p 3000 -b 0.0.0.0"
    networks:
      - plataforma_net_local

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api_local
    restart: always
    depends_on:
      postgres:
        condition: service_started
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-evolution_key_local}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-plataforma}:${POSTGRES_PASSWORD:-securepassword123}@postgres:5432/evolution_db
      CHATWOOT_ENABLED: "true"
      CHATWOOT_URL: http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - plataforma_net_local

volumes:
  postgres_data_local:
  redis_data_local:

networks:
  plataforma_net_local:
    driver: bridge